<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CortexMove - SPPlab</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: var(--card-bg);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button, label {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button.btn-primary {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 0.85rem;
    }

    /* Info Bar */
    .info-bar {
      background-color: rgba(30, 41, 59, 0.8);
      padding: 8px 20px;
      display: flex;
      justify-content: space-around;
      font-size: 0.9rem;
      border-bottom: 1px solid #334155;
    }

    .info-item span {
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Main Area */
    main {
      flex: 1;
      display: flex;
      position: relative;
    }

    .side-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    .side-panel.left {
      border-right: 2px dashed #334155;
    }

    /* Original Display Card Style */
    .card-display {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
      width: 80%;
      height: 70%;
      max-width: 320px;
      text-align: center;
      position: relative;
    }

    .card-icon {
      font-size: 5.5rem;
      line-height: 1;
    }

    .card-label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #94a3b8;
    }

    /* Center Dual-Task Math Overlay */
    .math-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 50%;
      width: 100px;
      height: 100px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      z-index: 5;
    }

    .math-overlay .title {
      font-size: 0.6rem;
      color: #94a3b8;
    }

    .math-overlay .content {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    /* Touch Module Inside Card */
    .touch-grid {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .touch-dot {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .touch-dot.active {
      transform: scale(0.9);
      opacity: 0.3;
    }

    /* Instruction Box */
    .instruction-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--accent-color);
      font-size: 0.85rem;
      color: var(--accent-color);
      z-index: 4;
      pointer-events: none;
    }

    /* Footer */
    footer {
      background-color: var(--card-bg);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #334155;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .trainer-btn {
      padding: 8px 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
    }
    .btn-correct { background-color: var(--success-color); color: #fff; }
    .btn-wrong { background-color: var(--danger-color); color: #fff; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <div class="brand-title">🧠 CortexMove</div>
      <div class="brand-subtitle">Sporda Performans Psikolojisi Lab (SPPlab)</div>
    </div>
    
    <div class="controls">
      <select id="moduleSelect">
        <option value="hand">1. El Hareketleri Modülü</option>
        <option value="touch">2. Dokunmatik Renk Modülü</option>
      </select>

      <select id="difficultySelect">
        <option value="easy">Kolay (3 sn)</option>
        <option value="medium" selected>Orta (2 sn)</option>
        <option value="hard">Zor (1.2 sn)</option>
        <option value="expert">Çok Zor (0.8 sn)</option>
      </select>

      <div class="toggle-container">
        <input type="checkbox" id="mathToggle">
        <label for="mathToggle" style="padding:0; border:none; background:none;">Matematik Görevi</label>
      </div>

      <button id="startBtn" class="btn-primary">Başlat</button>
    </div>
  </header>

  <!-- Info Bar -->
  <div class="info-bar">
    <div class="info-item">Süre: <span id="timerDisplay">00:00</span></div>
    <div class="info-item">Aşama: <span id="stepDisplay">0 / 15</span></div>
    <div class="info-item">Tepki: <span id="reactionDisplay">0 ms</span></div>
  </div>

  <!-- Main Area -->
  <main>
    <div class="instruction-banner" id="instructionBanner">Egzersizi başlatmak için 'Başlat' butonuna basın.</div>
    
    <!-- Left Display Panel -->
    <div class="side-panel left">
      <div class="card-display" id="leftCard">
        <div class="card-icon" id="leftIcon">✊</div>
        <div class="card-label" id="leftLabel">SOL EL</div>
        <div class="touch-grid" id="leftTouchGrid" style="display:none;"></div>
      </div>
    </div>

    <!-- Center Math Overlay -->
    <div class="math-overlay" id="mathOverlay">
      <div class="title">MATEMATİK</div>
      <div class="content" id="mathContent">3 + 4</div>
    </div>

    <!-- Right Display Panel -->
    <div class="side-panel right">
      <div class="card-display" id="rightCard">
        <div class="card-icon" id="rightIcon">🖐️</div>
        <div class="card-label" id="rightLabel">SAĞ EL</div>
        <div class="touch-grid" id="rightTouchGrid" style="display:none;"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div>SPPlab - CortexMove | Otomatik Geçiş Sistemi Active</div>
    <div style="display:flex; gap:10px;">
      <button class="trainer-btn btn-wrong" id="wrongBtn">🔴 Hatalı (Z)</button>
      <button class="trainer-btn btn-correct" id="correctBtn">🟢 Doğru (A)</button>
    </div>
  </footer>

  <script>
    // State Variables
    let isRunning = false;
    let currentStep = 0;
    const maxSteps = 15;
    let timerInterval = null;
    let autoStepTimeout = null;
    let startTime = 0;
    let stepStartTime = 0;
    
    let requiredTouches = 0;
    let currentTouches = 0;

    // Movement Sets
    const movements = [
      { icon: '✊', name: 'Yumruk' },
      { icon: '🖐️', name: 'Açık El' },
      { icon: '✌️', name: 'Zafer' },
      { icon: '👍', name: 'Başparmak' },
      { icon: '🤏', name: 'Çimdik' },
      { icon: '🤟', name: 'Rock' }
    ];

    const colors = [
      { name: 'Mavi', hex: '#3b82f6' },
      { name: 'Kırmızı', hex: '#ef4444' },
      { name: 'Yeşil', hex: '#22c55e' },
      { name: 'Sarı', hex: '#eab308' }
    ];

    // Difficulty Speeds (ms)
    const speeds = {
      easy: 3000,
      medium: 2000,
      hard: 1200,
      expert: 800
    };

    // DOM Elements
    const startBtn = document.getElementById('startBtn');
    const moduleSelect = document.getElementById('moduleSelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const mathToggle = document.getElementById('mathToggle');
    
    const timerDisplay = document.getElementById('timerDisplay');
    const stepDisplay = document.getElementById('stepDisplay');
    const reactionDisplay = document.getElementById('reactionDisplay');
    const instructionBanner = document.getElementById('instructionBanner');
    
    const leftIcon = document.getElementById('leftIcon');
    const leftLabel = document.getElementById('leftLabel');
    const rightIcon = document.getElementById('rightIcon');
    const rightLabel = document.getElementById('rightLabel');
    
    const leftTouchGrid = document.getElementById('leftTouchGrid');
    const rightTouchGrid = document.getElementById('rightTouchGrid');
    const mathOverlay = document.getElementById('mathOverlay');
    const mathContent = document.getElementById('mathContent');

    // Controls
    startBtn.addEventListener('click', toggleGame);
    document.getElementById('correctBtn').addEventListener('click', () => recordScore(true));
    document.getElementById('wrongBtn').addEventListener('click', () => recordScore(false));

    function toggleGame() {
      if (isRunning) stopGame();
      else startGame();
    }

    function startGame() {
      isRunning = true;
      currentStep = 0;
      startBtn.textContent = 'Durdur';
      startBtn.style.backgroundColor = 'var(--danger-color)';
      
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
      
      autoNextStep();
    }

    function stopGame() {
      isRunning = false;
      clearInterval(timerInterval);
      clearTimeout(autoStepTimeout);
      startBtn.textContent = 'Başlat';
      startBtn.style.backgroundColor = 'var(--accent-color)';
      instructionBanner.textContent = "Egzersiz durduruldu.";
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    function autoNextStep() {
      if (!isRunning) return;

      currentStep++;
      if (currentStep > maxSteps) {
        alert("🎉 Seans Tamamlandı!");
        stopGame();
        return;
      }

      stepDisplay.textContent = `${currentStep} / ${maxSteps}`;
      stepStartTime = Date.now();

      const activeModule = moduleSelect.value;
      const speed = speeds[difficultySelect.value];

      // Math Task Overlay Toggle
      if (mathToggle.checked && Math.random() > 0.4) {
        mathOverlay.style.display = 'flex';
        const num1 = Math.floor(Math.random() * 9) + 1;
        const num2 = Math.floor(Math.random() * 9) + 1;
        mathContent.textContent = `${num1} + ${num2}`;
      } else {
        mathOverlay.style.display = 'none';
      }

      // Render Module
      if (activeModule === 'hand') {
        renderHandModule();
      } else {
        renderTouchModule();
      }

      // Set timeout for automatic next step (Random/Rastgele Otomatik Akış)
      autoStepTimeout = setTimeout(() => {
        autoNextStep();
      }, speed);
    }

    function renderHandModule() {
      leftIcon.style.display = 'block';
      leftLabel.style.display = 'block';
      rightIcon.style.display = 'block';
      rightLabel.style.display = 'block';
      leftTouchGrid.style.display = 'none';
      rightTouchGrid.style.display = 'none';

      instructionBanner.textContent = '🖐️ Şekillere göre hareketi ellerinizle yapın!';

      const left = movements[Math.floor(Math.random() * movements.length)];
      const right = movements[Math.floor(Math.random() * movements.length)];

      leftIcon.textContent = left.icon;
      leftLabel.textContent = left.name;
      rightIcon.textContent = right.icon;
      rightLabel.textContent = right.name;
    }

    function renderTouchModule() {
      leftIcon.style.display = 'none';
      leftLabel.style.display = 'none';
      rightIcon.style.display = 'none';
      rightLabel.style.display = 'none';
      leftTouchGrid.style.display = 'flex';
      rightTouchGrid.style.display = 'flex';

      leftTouchGrid.innerHTML = '';
      rightTouchGrid.innerHTML = '';

      const targetColor = colors[Math.floor(Math.random() * colors.length)];
      const forbiddenColor = colors.find(c => c.hex !== targetColor.hex);

      instructionBanner.textContent = `👉 HEDEF: ${targetColor.name} dairelere basın! (${forbiddenColor.name} renge dokunmayın!)`;

      requiredTouches = 2;
      currentTouches = 0;

      // Add Target Dot to Left & Right
      createDot(leftTouchGrid, targetColor);
      createDot(rightTouchGrid, targetColor);

      // Add Decoy/Forbidden Dot randomly
      if (Math.random() > 0.5) {
        createDot(leftTouchGrid, forbiddenColor, true);
      }
    }

    function createDot(container, colorObj, isForbidden = false) {
      const dot = document.createElement('div');
      dot.className = 'touch-dot';
      dot.style.backgroundColor = colorObj.hex;
      dot.textContent = isForbidden ? '❌' : '🎯';

      dot.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (isForbidden) {
          reactionDisplay.textContent = 'HATALI!';
        } else {
          if (!dot.classList.contains('active')) {
            dot.classList.add('active');
            currentTouches++;
            
            const reaction = Date.now() - stepStartTime;
            reactionDisplay.textContent = `${reaction} ms`;

            if (currentTouches >= requiredTouches) {
              clearTimeout(autoStepTimeout);
              setTimeout(autoNextStep, 150);
            }
          }
        }
      });

      container.appendChild(dot);
    }

    function recordScore(isCorrect) {
      // Manual scoring by trainer
      const status = isCorrect ? "🟢 Doğru" : "🔴 Hatalı";
      reactionDisplay.textContent = status;
    }
  </script>
</body>
</html>
